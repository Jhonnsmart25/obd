# Opcional: "Blueprint" de Render. También puedes crear el servicio a mano (ver README).
services:
  - type: web
    name: traductor-obd
    runtime: docker
    plan: starter
    healthCheckPath: /healthz
    disk:
      name: datos
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATA_DIR
        value: /var/data
      - key: APP_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_PRICE_ID
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
